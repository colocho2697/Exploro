name: exploro-infra

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgis
    container_name: exploro-postgres-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exploro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exploro_dev_local_pass}
      POSTGRES_DB: ${POSTGRES_DB:-exploro_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - exploro_pg_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exploro} -d ${POSTGRES_DB:-exploro_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: exploro-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - exploro_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    container_name: exploro-minio-s3
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-exploro_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-exploro_minio_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - exploro_minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: ../../services/ai-engine
      dockerfile: Dockerfile
    container_name: exploro-ai-engine
    restart: unless-stopped
    environment:
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev_internal_service_key_exploro_ai_2026}
      AI_PROVIDER: ${AI_PROVIDER:-ollama_zero_cost}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-qwen2.5:7b}
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  exploro_pg_data:
  exploro_redis_data:
  exploro_minio_data:
